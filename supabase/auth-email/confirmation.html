<div style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;color:#1C1A1B;background:#FBFAF9">
  <h1 style="font-family:Georgia,serif;font-size:22px;font-weight:600;margin:0 0 12px">Confirm your Taskfold account</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 20px">Enter this code in Taskfold to confirm your email address:</p>
  <p style="font-size:32px;font-weight:600;letter-spacing:8px;margin:0 0 20px;font-family:Menlo,monospace">{{ .Token }}</p>
  <p style="font-size:13px;line-height:1.5;color:#6E6A6C;margin:0">The code works for one hour. If you didn't create a Taskfold account, you can ignore this email.</p>
</div>
