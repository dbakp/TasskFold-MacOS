<style>
#taskfold-px-progress { color: var(--foreground); min-width: 0; }
#taskfold-px-progress .px-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
#taskfold-px-progress .px-head h1 { margin: 0; }
#taskfold-px-progress .px-intro { margin: 12px 0; }
#taskfold-px-progress .px-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0 8px; }
#taskfold-px-progress .px-key { display: inline-flex; align-items: center; gap: 6px; }
#taskfold-px-progress .px-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#taskfold-px-progress summary { padding: 12px 0; min-height: 44px; }
#taskfold-px-progress .px-summary { display: inline-grid; vertical-align: top; width: calc(100% - 1.4em); gap: 6px; }
#taskfold-px-progress .px-heading { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
#taskfold-px-progress .px-title { font-weight: 500; }
#taskfold-px-progress .px-meter { display: block; width: 100%; height: 8px; border-radius: 4px; }
#taskfold-px-progress .px-stage { border-top: 1px solid var(--border); margin-top: 12px; }
#taskfold-px-progress .px-group { margin-left: 16px; }
#taskfold-px-progress .px-items { list-style: none; padding: 0; margin: 0 0 12px 16px; }
#taskfold-px-progress .px-item { display: grid; grid-template-columns: 1.2em minmax(0, 1fr); column-gap: 8px; margin: 14px 0; }
#taskfold-px-progress .px-item-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
#taskfold-px-progress .px-item-title { flex: 1 1 220px; }
#taskfold-px-progress .px-item-detail { margin-top: 4px; }
#taskfold-px-progress .px-steps { list-style: none; padding: 0; margin: 10px 0 0; }
#taskfold-px-progress .px-step { display: grid; grid-template-columns: 1.2em minmax(0, 1fr); gap: 8px; margin: 6px 0; }
#taskfold-px-progress .px-sources { margin: 0 0 12px 16px; }
#taskfold-px-progress .px-source-list { padding-left: 20px; overflow-wrap: anywhere; }
#taskfold-px-progress .px-footer { border-top: 1px solid var(--border); margin-top: 16px; }
#taskfold-px-progress .px-footer ol { padding-left: 24px; }
#taskfold-px-progress .px-footer li { margin-bottom: 8px; }
@media (max-width: 480px) { #taskfold-px-progress .px-group { margin-left: 8px; } }
</style>
<div id="taskfold-px-progress">
<!--PX_CONTENT-->
</div>
<script>
(() => {
  const root = document.getElementById('taskfold-px-progress');
  const details = [...root.querySelectorAll('details[data-remember]')];
  function restore(state) {
    const saved = state?.privateContent;
    if (saved?.kind !== 'taskfold-px-progress' || !Array.isArray(saved.expanded)) return;
    for (const detail of details) detail.open = saved.expanded.includes(detail.id);
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  root.addEventListener('click', event => {
    const summary = event.target instanceof Element ? event.target.closest('summary') : null;
    if (!summary || !root.contains(summary)) return;
    requestAnimationFrame(() => {
      const expanded = details.filter(detail => detail.open).map(detail => detail.id);
      const saved = window.openai?.setWidgetState?.({
        modelContent: { openPriorities: expanded.filter(id => /^px-p[012]$/.test(id)) },
        privateContent: { kind: 'taskfold-px-progress', expanded }
      });
      saved?.catch?.(() => {});
    });
  });
})();
</script>
